# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: test
on: { push: { branches: [master], tags: [v*] }, pull_request: null, workflow_dispatch: null }
permissions: { contents: read }
env: { DPRINT_NON_LATEST: 0.55.0 }
defaults: { run: { shell: pwsh } }
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: git diff --exit-code dist/

  install:
    strategy: { matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - { uses: ./, id: install }
      - { name: verify binary, run: dprint --version }
      - name: verify outputs
        env: { OUTPUTS: "${{ toJSON(steps.install.outputs) }}" }
        run: |
          $o = $env:OUTPUTS | ConvertFrom-Json
          @"
          version={0}
          location={1}
          cache-hit={2}
          "@ -f $o.version, $o.location, $o.'cache-hit'
          if ([string]::IsNullOrEmpty($o.version))  { "::error::version output empty";  exit 1 }
          if ([string]::IsNullOrEmpty($o.location)) { "::error::location output empty"; exit 1 }

  cache-hit:
    needs: install
    strategy: { matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - { uses: ./, id: install }
      - name: verify cache hit on second run
        env: { OUTPUTS: "${{ toJSON(steps.install.outputs) }}" }
        run: |
          $o = $env:OUTPUTS | ConvertFrom-Json; "cache-hit={0}" -f $o.'cache-hit'
          if ($o.'cache-hit' -ne 'true') { "::warning::Expected cache-hit=true on second run" }

  plugin-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - { uses: ./, id: install }
      - name: verify plugin cache outputs
        env: { OUTPUTS: "${{ toJSON(steps.install.outputs) }}" }
        run: |
          $o = $env:OUTPUTS | ConvertFrom-Json
          @"
          plugin-cache-hit={0}
          plugin-cache-key={1}
          "@ -f $o.'plugin-cache-hit', $o.'plugin-cache-key'

          # Config file exists in this repo, so key should be set
          if ([string]::IsNullOrEmpty($o.'plugin-cache-key')) { "::warning::Expected plugin-cache-key non-empty (no config found?)" }

  no-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - { uses: ./, id: install, with: { cache: false } }
      - name: verify no cache outputs when disabled
        env: { OUTPUTS: "${{ toJSON(steps.install.outputs) }}" }
        run: $o = $env:OUTPUTS | ConvertFrom-Json; "cache-hit={0}`nplugin-cache-hit={1}" -f $o.'cache-hit', $o.'plugin-cache-hit'

  specific-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - { uses: ./, id: install, with: { version: "${{ env.DPRINT_NON_LATEST }}" } }
      - name: verify exact version
        env: { OUTPUTS: "${{ toJSON(steps.install.outputs) }}" }
        run: |
          $o = $env:OUTPUTS | ConvertFrom-Json
          echo "version={0}" -f $o.version

          if ($o.version -ne $env:DPRINT_NON_LATEST) {
            "::error::Expected ${0}, got {1}" -f $env:DPRINT_NON_LATEST, $o.version
            exit 1
          }
